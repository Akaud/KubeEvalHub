name: CI

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t kubeevalhub-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t kubeevalhub-frontend ./frontend